# This is a basic workflow to help you get started with Actions

name: eugeneermakov696

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env: 
  GITHUB_ACTIONS: "true"
  

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  github-task-job:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: usage of variable
        run: echo "${{ env.GITHUB_ACTIONS }}"

      - name: presantation of branch and repo names
        run: echo "Branch name is ${{ github.ref }}, repo name is ${{ github.repository }}"

      - name: event  
        run: echo "Trigger event is ${{ github.event_name }}"

 
